<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Good Ticketing — Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3352;
      --text: #e2e8f0;
      --muted: #7c85a8;
      --green: #22c55e;
      --green-bg: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.12);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245,158,11,0.12);
      --blue: #3b82f6;
      --blue-bg: rgba(59,130,246,0.12);
      --purple: #a855f7;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
    }
    #status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
    #status-dot.error { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #timestamp { font-size: 0.8rem; color: var(--muted); }

    button#refresh-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
    }
    button#refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .grid-3 { grid-template-columns: 1fr; } }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Service cards ── */
    .service-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .service-card:hover { border-color: var(--accent); }

    .svc-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .svc-dot.healthy   { background: var(--green);  box-shadow: 0 0 6px var(--green); }
    .svc-dot.unhealthy { background: var(--red);    box-shadow: 0 0 6px var(--red); }
    .svc-dot.unreachable { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .svc-dot.loading   { background: var(--muted); }

    .svc-info { flex: 1; min-width: 0; }
    .svc-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .svc-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .cpu-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }
    .cpu-bar-bg {
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }
    .cpu-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .cpu-label {
      font-size: 0.68rem;
      font-weight: 600;
      min-width: 38px;
      text-align: right;
    }
    .net-row {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .svc-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .svc-badge.healthy   { background: var(--green-bg);  color: var(--green); }
    .svc-badge.unhealthy { background: var(--red-bg);    color: var(--red); }
    .svc-badge.unreachable { background: var(--yellow-bg); color: var(--yellow); }
    .svc-badge.loading   { background: var(--surface2); color: var(--muted); }

    /* ── Three-col layout for lower sections ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 1100px) { .two-col { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px)  { .two-col { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    /* ── Queues ── */
    .queue-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .queue-row:last-child { border-bottom: none; }

    .queue-label { flex: 1; font-size: 0.85rem; color: var(--text); }
    .queue-key   { font-size: 0.75rem; color: var(--muted); font-family: monospace; }

    .queue-depth {
      font-size: 1rem;
      font-weight: 700;
      min-width: 32px;
      text-align: right;
    }
    .queue-depth.zero  { color: var(--muted); }
    .queue-depth.low   { color: var(--green); }
    .queue-depth.mid   { color: var(--yellow); }
    .queue-depth.high  { color: var(--red); }

    .queue-bar-wrap {
      width: 80px;
      background: var(--surface2);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .queue-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .queue-bar.zero  { background: var(--muted); }
    .queue-bar.low   { background: var(--green); }
    .queue-bar.mid   { background: var(--yellow); }
    .queue-bar.high  { background: var(--red); }

    /* ── Purchases pipeline ── */
    .pipeline-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .pipeline-col-header {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      text-align: center;
    }
    .pipeline-col-header.processing { background: var(--blue-bg);   color: var(--blue); }
    .pipeline-col-header.success    { background: var(--green-bg);  color: var(--green); }
    .pipeline-col-header.failed     { background: var(--red-bg);    color: var(--red); }
    .pipeline-col-header.unknown    { background: var(--surface2);  color: var(--muted); }

    .purchase-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 0.78rem;
    }
    .purchase-card .pc-id {
      font-family: monospace;
      color: var(--accent);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }
    .purchase-card .pc-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      margin-top: 2px;
    }
    .purchase-card .pc-row span:last-child { color: var(--text); }

    .empty-col {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 20px 0;
    }

    /* ── Redis status bar ── */
    .redis-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .redis-indicator {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .redis-indicator.connected { background: var(--green); }

    /* ── Full-width pipeline section ── */
    .full-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }

    /* ── Load test panel ── */
    .k6-select {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.82rem;
      margin-bottom: 10px;
    }
    .k6-select:focus { outline: none; border-color: var(--accent); }

    .k6-run-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 7px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      background: var(--accent);
      color: #fff;
    }
    .k6-run-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .k6-run-btn:hover:not(:disabled) { opacity: 0.85; }
    .k6-run-btn.running { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }

    .k6-status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 20px;
    }
    .k6-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }
    .k6-dot.running { background: var(--green); box-shadow: 0 0 5px var(--green); animation: pulse 1.5s infinite; }
    .k6-dot.done    { background: var(--green); }
    .k6-dot.error   { background: var(--red); }

    .k6-elapsed {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: monospace;
    }

    #error-banner {
      background: var(--red-bg);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:16px;flex:1">
      <h1>Super Good Ticketing <span>Dashboard</span></h1>
      <nav style="display:flex;gap:4px">
        <a href="/" style="color:var(--accent);background:var(--surface2);padding:4px 12px;border-radius:6px;font-size:0.85rem;text-decoration:none;font-weight:600">Overview</a>
        <a href="/events.html" style="color:var(--muted);padding:4px 12px;border-radius:6px;font-size:0.85rem;text-decoration:none" onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'" onmouseout="this.style.color='var(--muted)';this.style.background='transparent'">Events</a>
        <a href="/test.html" style="color:var(--muted);padding:4px 12px;border-radius:6px;font-size:0.85rem;text-decoration:none" onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'" onmouseout="this.style.color='var(--muted)';this.style.background='transparent'">Test Runner</a>
        <a href="/architecture.html" style="color:var(--muted);padding:4px 12px;border-radius:6px;font-size:0.85rem;text-decoration:none" onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'" onmouseout="this.style.color='var(--muted)';this.style.background='transparent'">Architecture</a>
      </nav>
    </div>
    <div class="header-right">
      <span id="status-dot" class="loading"></span>
      <span id="timestamp">Loading…</span>
      <button id="refresh-btn" onclick="refresh()">Refresh</button>
    </div>
  </header>

  <div id="error-banner"></div>

  <div class="redis-bar">
    <div id="redis-indicator" class="redis-indicator"></div>
    <span id="redis-status">Redis: checking…</span>
  </div>

  <p class="section-title">Services</p>
  <div class="grid-3" id="services-grid">
    <!-- populated by JS -->
  </div>

  <div class="two-col">
    <div class="panel">
      <p class="section-title">Queue Depths</p>
      <div id="queues-list"></div>
    </div>

    <div class="panel">
      <p class="section-title">Redis Stats</p>
      <div id="redis-stats"></div>
    </div>

    <div class="panel">
      <p class="section-title">Load Test</p>
      <select id="k6-script" class="k6-select">
        <option value="sprint-3-poison">Sprint 3 — Purchase Pipeline (~70s) ← shows queues</option>
        <option value="sprint-4-scale">Sprint 4 — Scale Test, reads only (~100s)</option>
        <option value="sprint-4-replica">Sprint 4 — Replica Test, reads only (~70s)</option>
        <option value="sprint-2-cache">Sprint 2 — Cache Test, reads only (~70s)</option>
      </select>
      <button id="k6-btn" class="k6-run-btn" onclick="runK6()">▶ Run Load Test</button>
      <div class="k6-status-row">
        <div class="k6-dot" id="k6-dot"></div>
        <span id="k6-status-text">Idle</span>
      </div>
      <div class="k6-elapsed" id="k6-elapsed"></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <p class="section-title" style="margin-bottom:4px">Reset All Data</p>
      <p style="font-size:0.78rem;color:var(--muted);line-height:1.5">
        Flushes Redis entirely and truncates all database tables. Event catalog will need re-seeding afterward.
      </p>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button id="reset-btn" onclick="resetAll()" style="padding:8px 18px;border-radius:8px;border:1px solid var(--red);background:var(--red-bg);color:var(--red);font-size:0.85rem;font-weight:600;cursor:pointer;transition:opacity .15s">
        ⚠ Reset All Data
      </button>
      <span id="reset-status" style="font-size:0.8rem;color:var(--muted)"></span>
    </div>
  </div>

  <div class="full-panel">
    <p class="section-title">Live Request Pipeline</p>
    <div class="pipeline-cols" id="pipeline"></div>
  </div>

  <script>
    const REFRESH_MS = 3000;
    let timer = null;

    function scheduleRefresh() {
      clearTimeout(timer);
      timer = setTimeout(refresh, REFRESH_MS);
    }

    async function refresh() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
        document.getElementById('error-banner').style.display = 'none';
      } catch (err) {
        const banner = document.getElementById('error-banner');
        banner.textContent = `Error fetching status: ${err.message}`;
        banner.style.display = 'block';
        document.getElementById('status-dot').className = 'error';
      } finally {
        scheduleRefresh();
      }
    }

    function render(data) {
      document.getElementById('timestamp').textContent = `Updated: ${new Date(data.timestamp).toLocaleTimeString()}`;
      document.getElementById('status-dot').className = 'live';

      // Redis status
      const ri = document.getElementById('redis-indicator');
      const rs = document.getElementById('redis-status');
      if (data.redis === 'connected') {
        ri.className = 'redis-indicator connected';
        rs.textContent = 'Redis: connected';
      } else {
        ri.className = 'redis-indicator';
        rs.textContent = `Redis: ${data.redis}`;
      }

      renderServices(data.services);
      renderQueues(data.queues);
      renderRedisStats(data.queues);
      renderPipeline(data.purchases);
    }

    function renderServices(services) {
      const grid = document.getElementById('services-grid');
      grid.innerHTML = services.map(svc => {
        const status = svc.status;
        const meta = [
          svc.uptime_seconds != null ? `up ${fmtUptime(svc.uptime_seconds)}` : null,
          svc.latency_ms != null ? `db ${svc.latency_ms}ms` : null,
          svc.instance ? `#${svc.instance.slice(0, 8)}` : null,
        ].filter(Boolean).join(' · ');

        const cpu = svc.cpuPct ?? null;
        const cpuColor = cpu === null ? 'var(--muted)'
          : cpu < 20  ? 'var(--green)'
          : cpu < 60  ? 'var(--yellow)'
          : 'var(--red)';
        const cpuWidth = cpu !== null ? Math.min(cpu, 100).toFixed(1) : 0;

        const cpuHtml = cpu !== null ? `
          <div class="cpu-row">
            <div class="cpu-bar-bg">
              <div class="cpu-bar-fill" style="width:${cpuWidth}%;background:${cpuColor}"></div>
            </div>
            <span class="cpu-label" style="color:${cpuColor}">${cpu.toFixed(1)}%</span>
          </div>` : '';

        const netHtml = (svc.rxRate !== null && svc.txRate !== null)
          ? `<div class="net-row">↓ ${fmtBytes(svc.rxRate)}/s &nbsp; ↑ ${fmtBytes(svc.txRate)}/s</div>`
          : '';

        return `<div class="service-card">
          <div class="svc-dot ${status}"></div>
          <div class="svc-info">
            <div class="svc-name">${svc.name}</div>
            <div class="svc-meta">${meta || (svc.error ? svc.error.slice(0, 40) : '—')}</div>
            ${cpuHtml}${netHtml}
          </div>
          <div class="svc-badge ${status}">${status.toUpperCase()}</div>
        </div>`;
      }).join('');
    }

    function fmtBytes(b) {
      if (b < 1024) return `${b} B`;
      if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
      return `${(b / 1024 / 1024).toFixed(1)} MB`;
    }

    function renderQueues(queues) {
      const maxDepth = Math.max(...queues.map(q => q.depth), 1);
      const list = document.getElementById('queues-list');
      list.innerHTML = queues.map(q => {
        const cls = q.depth === 0 ? 'zero' : q.depth < 5 ? 'low' : q.depth < 20 ? 'mid' : 'high';
        const pct = q.depth <= 0 ? 0 : Math.min(100, Math.round((q.depth / Math.max(maxDepth, 10)) * 100));
        return `<div class="queue-row">
          <div>
            <div class="queue-label">${q.label}</div>
            <div class="queue-key">${q.name}</div>
          </div>
          <div class="queue-bar-wrap"><div class="queue-bar ${cls}" style="width:${pct}%"></div></div>
          <div class="queue-depth ${cls}">${q.depth < 0 ? '?' : q.depth}</div>
        </div>`;
      }).join('');
    }

    function renderRedisStats(queues) {
      const total = queues.reduce((s, q) => s + Math.max(0, q.depth), 0);
      const nonEmpty = queues.filter(q => q.depth > 0).length;
      const dlqTotal = queues.filter(q => q.name.includes('dlq')).reduce((s, q) => s + Math.max(0, q.depth), 0);

      document.getElementById('redis-stats').innerHTML = `
        <div class="queue-row">
          <div class="queue-label">Total items in queues</div>
          <div class="queue-depth ${total === 0 ? 'zero' : total < 20 ? 'low' : 'mid'}">${total}</div>
        </div>
        <div class="queue-row">
          <div class="queue-label">Active queues (non-empty)</div>
          <div class="queue-depth ${nonEmpty === 0 ? 'zero' : 'low'}">${nonEmpty} / ${queues.length}</div>
        </div>
        <div class="queue-row">
          <div class="queue-label">Dead letter queue items</div>
          <div class="queue-depth ${dlqTotal === 0 ? 'zero' : dlqTotal < 5 ? 'mid' : 'high'}">${dlqTotal}</div>
        </div>
      `;
    }

    function renderPipeline(purchases) {
      const groups = {
        processing: purchases.filter(p => p.state === 'processing'),
        success:    purchases.filter(p => p.state === 'success'),
        failed:     purchases.filter(p => p.state === 'failed'),
      };

      const labels = { processing: 'In Progress', success: 'Completed', failed: 'Failed' };

      document.getElementById('pipeline').innerHTML = Object.entries(groups).map(([state, items]) => `
        <div>
          <div class="pipeline-col-header ${state}">${labels[state]} (${items.length})</div>
          ${items.length === 0
            ? `<div class="empty-col">No ${state} requests</div>`
            : items.slice(0, 10).map(p => `
              <div class="purchase-card">
                <div class="pc-id">${p.idemKey}</div>
                ${p.purchaseId ? `<div class="pc-row"><span>Purchase ID</span><span>#${p.purchaseId}</span></div>` : ''}
                ${p.eventId    ? `<div class="pc-row"><span>Event</span><span>${p.eventId.slice(0,8)}…</span></div>` : ''}
                ${p.seats      ? `<div class="pc-row"><span>Seats</span><span>${p.seats}</span></div>` : ''}
                ${p.charge     ? `<div class="pc-row"><span>Charge</span><span>$${p.charge}</span></div>` : ''}
              </div>`).join('')
          }
        </div>
      `).join('');
    }

    function fmtUptime(s) {
      if (s < 60)   return `${s}s`;
      if (s < 3600) return `${Math.floor(s/60)}m`;
      return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
    }

    // ── k6 load test controls ─────────────────────────────────────────────────
    let k6PollTimer = null;

    async function runK6() {
      const btn = document.getElementById('k6-btn');
      const script = document.getElementById('k6-script').value;
      btn.disabled = true;
      btn.textContent = '▶ Starting…';
      setK6Status('running', 'Starting…');

      try {
        const res = await fetch('/api/admin/k6', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script }),
        });
        const data = await res.json();
        if (data.ok) {
          startK6Poll();
        } else {
          setK6Status('error', data.error || 'Failed to start');
          btn.disabled = false;
          btn.textContent = '▶ Run Load Test';
          btn.classList.remove('running');
        }
      } catch (err) {
        setK6Status('error', err.message);
        btn.disabled = false;
        btn.textContent = '▶ Run Load Test';
        btn.classList.remove('running');
      }
    }

    function startK6Poll() {
      clearInterval(k6PollTimer);
      k6PollTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/admin/k6/status');
          const data = await res.json();
          const btn = document.getElementById('k6-btn');
          if (data.running) {
            const elapsed = data.startedAt
              ? Math.round((Date.now() - new Date(data.startedAt)) / 1000)
              : '?';
            setK6Status('running', `Running: ${data.script}`);
            document.getElementById('k6-elapsed').textContent = `${elapsed}s elapsed`;
            btn.disabled = true;
            btn.textContent = '● Running…';
            btn.classList.add('running');
          } else {
            setK6Status('done', 'Finished');
            document.getElementById('k6-elapsed').textContent = '';
            btn.disabled = false;
            btn.textContent = '▶ Run Load Test';
            btn.classList.remove('running');
            clearInterval(k6PollTimer);
          }
        } catch {}
      }, 3000);
    }

    function setK6Status(type, text) {
      document.getElementById('k6-dot').className = `k6-dot ${type}`;
      document.getElementById('k6-status-text').textContent = text;
    }

    // ── Reset all data ────────────────────────────────────────────────────────
    async function resetAll() {
      const btn = document.getElementById('reset-btn');
      const statusEl = document.getElementById('reset-status');
      if (!confirm('This will flush Redis and truncate ALL database tables. Continue?')) return;
      btn.disabled = true;
      btn.textContent = 'Resetting…';
      statusEl.textContent = '';
      try {
        const res = await fetch('/api/admin/reset', { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
          statusEl.style.color = 'var(--green)';
          statusEl.textContent = '✓ Done — all data cleared';
        } else {
          statusEl.style.color = 'var(--red)';
          statusEl.textContent = '✗ ' + (data.error || 'Unknown error');
        }
      } catch (err) {
        statusEl.style.color = 'var(--red)';
        statusEl.textContent = '✗ ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '⚠ Reset All Data';
      }
    }

    // Check on load in case a run is already in progress
    fetch('/api/admin/k6/status').then(r => r.json()).then(data => {
      if (data.running) startK6Poll();
    }).catch(() => {});

    // Seed the services grid with loading cards immediately
    document.getElementById('services-grid').innerHTML = [
      'ticket-purchase','payment','refund','fraud-worker',
      'analytics','notification','event-catalog','waitlist','users'
    ].map(name => `<div class="service-card">
      <div class="svc-dot loading"></div>
      <div class="svc-info"><div class="svc-name">${name}</div><div class="svc-meta">Checking…</div></div>
      <div class="svc-badge loading">…</div>
    </div>`).join('');

    refresh();
  </script>
</body>
</html>
